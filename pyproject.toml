[tool.poetry]
name = "wigner-time"
version = "0.9.0"
description = "Timeline creation and management for experiments in quantum science and technology"
license = "GPL-3.0-or-later"
authors = [
    "LightMatters <clark.thomaswilliam@zoho.eu>",
    "András Vukics <andras.vukics@gmail.com>",
]
readme = "README.md"
packages = [{ include = "wignertime", from = "src" }]

homepage = "https://github.com/WignerQuantumOptics/Wigner_Time"
repository = "https://github.com/WignerQuantumOptics/Wigner_Time"
# FIXME: confirm the published mkdocs/mike URL before releasing.
documentation = "https://WignerQuantumOptics.github.io/Wigner_Time"

keywords = [
    "timeline",
    "experiment control",
    "multidevice control",
    "hardware timing",
    "quantum science",
    "quantum technology",
    "atomic physics",
    "cold atoms",
    "ADwin",
]

# NOTE: no "License :: OSI Approved :: ..." classifier here on purpose —
# Poetry derives it from the `license` field above, and specifying both
# can be rejected under PEP 639.
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: System :: Hardware :: Hardware Drivers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]

[tool.poetry.dependencies]
python = ">=3.10"
munch = "^3.0.0"
funcy = "^2.0"
# One implementation serves pandas and polars (`internal/dataframe/`).
narwhals = "^2.26"
scipy = "^1.14"

# A timeline is held in pandas or in polars, and one of the two must be installed: the
# `pandas` or the `polars` extra. The package refuses to import with neither, naming them.
# pandas 3 needs Python 3.11, and the package still supports 3.10 on pandas 2. One
# constraint is enough: pandas 3 itself requires 3.11, so Poetry locks 2.x for 3.10 and
# 3.x above it. Split per Python version *and* optional, the constraint made Poetry 2.5
# lock numpy 2.2.6 for every Python below 3.14, overlapping 2.4.6 on 3.11, and install
# both into one environment, which broke numpy (CI on PR #171, 2026-10-02).
pandas = {version = ">=2.2,<4", optional = true}
polars = {version = ">=1.30", optional = true}

ADwin = {version="^0.20", optional=true}
pyarrow = {version="^22", optional=true}
matplotlib = {version="^3.7.1", optional=true}
pyqt6 = {version="^6.5.0", optional=true}
ipywidgets = {version="^8.1", optional=true}

[tool.poetry.extras]
pandas = ["pandas"]
polars = ["polars"]
adwin = ["ADwin"]
console = ["ADwin", "ipywidgets"]
performance_and_export = ["pyarrow"]
display = ["matplotlib", "pyqt6"]

[tool.poetry.group.dev.dependencies]
jupyter = "^1.1.1"
black = "^24.10.0"
pytest = "^7.3.1"
pyflakes = "^3.2.0"
isort = "^6.0.1"
mkdocstrings = {version = "^1.0.3", extras = ["python"]}
mkdocs-material = "^9.7.6"
mike = "^2.1.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
