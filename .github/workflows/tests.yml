name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # Both libraries installed, the suite run on each.
          - backend: pandas
            extras: --all-extras
          - backend: polars
            extras: --all-extras
          # Refuses any operation on a timeline that bypasses `wt_frame`.
          - backend: pandas-strict
            extras: --all-extras
          # polars without pandas: one of the two is enough.
          - backend: polars
            extras: --extras "polars adwin console display performance_and_export"

    name: ${{ matrix.backend }} (${{ matrix.extras }})

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: poetry install --with dev ${{ matrix.extras }}

      - name: Run tests
        run: poetry run pytest --backend=${{ matrix.backend }}
